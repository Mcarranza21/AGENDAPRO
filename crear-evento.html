<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Crea un nuevo evento en AgendaPro.">
  <title>Crear evento | AgendaPro</title>

  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Montserrat:wght@600;700&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <style>
    :root {
      --ap-primary: #16324f;
      --ap-accent: #087e8b;
      --ap-background: #f7f9fc;
      --ap-surface: #ffffff;
      --ap-muted: #64748b;
      --ap-border: #dce5ee;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--ap-background);
      color: var(--ap-primary);
      font-family: "Inter", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    h1, .navbar-brand { font-family: "Montserrat", Arial, sans-serif; }

    .page-layout {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    .container {
      width: min(100% - 2rem, 1140px);
      margin-inline: auto;
    }

    .navbar {
      padding: 1rem 0;
      background: rgba(247, 249, 252, 0.94);
      border-bottom: 1px solid rgba(22, 50, 79, 0.08);
      backdrop-filter: blur(12px);
    }

    .navbar-inner, .brand-link, footer .container {
      display: flex;
      align-items: center;
    }

    .navbar-inner, footer .container { justify-content: space-between; }

    .brand-link {
      gap: 0.5rem;
      color: var(--ap-primary);
      font-weight: 700;
      text-decoration: none;
    }

    .accent-text { color: var(--ap-accent); }

    .tagline, .intro, footer { color: var(--ap-muted); }

    .brand-mark {
      display: grid;
      width: 2.25rem;
      height: 2.25rem;
      place-items: center;
      border-radius: 0.7rem;
      background: var(--ap-primary);
      color: #fff;
      font-weight: 700;
    }

    .back-link {
      display: inline-flex;
      margin-bottom: 1.5rem;
      color: var(--ap-accent);
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover { color: #055d66; }

    .eyebrow {
      margin: 0 0 0.5rem;
      color: var(--ap-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .page-title {
      margin: 0 0 1rem;
      font-size: clamp(2rem, 5vw, 3.45rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.12;
    }

    .form-card {
      padding: clamp(1.5rem, 4vw, 3rem);
      border: 1px solid var(--ap-border);
      border-radius: 1rem;
      background: var(--ap-surface);
      box-shadow: 0 0.3rem 1.25rem rgba(22, 50, 79, 0.045);
    }

    main {
      flex: 1;
      padding: clamp(1.5rem, 5vw, 3rem) 0;
    }

    header { margin-bottom: 1.5rem; }

    .intro { margin: 0; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.5rem;
    }

    .full-width { grid-column: 1 / -1; }

    .form-label {
      display: inline-block;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .form-control {
      display: block;
      width: 100%;
      border-color: var(--ap-border);
      border-style: solid;
      border-width: 1px;
      border-radius: 0.375rem;
      background: #fff;
      color: var(--ap-primary);
      font: inherit;
      padding: 0.75rem 0.9rem;
    }

    .form-control:focus {
      border-color: var(--ap-accent);
      box-shadow: 0 0 0 0.25rem rgba(8, 126, 139, 0.13);
    }

    .btn-accent {
      border: 1px solid var(--ap-accent);
      border-radius: 0.5rem;
      background: var(--ap-accent);
      color: #fff;
      cursor: pointer;
      font: inherit;
      padding: 0.8rem 1.2rem;
      font-weight: 700;
    }

    .btn-accent:hover { background: #066d78; }

    .btn-accent:focus-visible {
      outline: 3px solid rgba(8, 126, 139, 0.3);
      outline-offset: 2px;
    }

    .btn-accent:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .form-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .alert {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid transparent;
      border-radius: 0.5rem;
    }

    .alert-success {
      border-color: #a3cfbb;
      background: #d1e7dd;
      color: #0a3622;
    }

    .alert-danger {
      border-color: #f1aeb5;
      background: #f8d7da;
      color: #58151c;
    }

    .d-none { display: none; }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    footer {
      padding: 1.5rem 0;
      border-top: 1px solid var(--ap-border);
      font-size: 0.85rem;
    }

    @media (max-width: 640px) {
      .tagline { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: auto; }
      .form-actions, footer .container {
        align-items: stretch;
        flex-direction: column;
      }
    }
  </style>
</head>
<body class="page-layout">
  <nav class="navbar" aria-label="Navegación principal">
    <div class="container navbar-inner">
      <a class="navbar-brand brand-link" href="./index.html" aria-label="AgendaPro, inicio">
        <span class="brand-mark" aria-hidden="true">A</span>
        <span>Agenda<span class="accent-text">Pro</span></span>
      </a>
      <span class="tagline">Organiza con claridad</span>
    </div>
  </nav>

  <main>
    <div class="container">
      <a class="back-link" href="./index.html"><i class="bi bi-arrow-left" aria-hidden="true"></i>&nbsp; Volver a eventos</a>

      <header>
        <p class="eyebrow">Nuevo evento</p>
        <h1 class="page-title">Crea tu evento</h1>
        <p class="intro">Completa la información para comenzar a organizar la agenda.</p>
      </header>

      <section class="form-card" aria-labelledby="formTitle">
        <h2 class="visually-hidden" id="formTitle">Información del evento</h2>
        <form id="eventForm">
          <div class="form-grid">
            <div class="full-width">
              <label class="form-label" for="nombre_evento">Nombre del evento</label>
              <input class="form-control" type="text" id="nombre_evento" name="nombre_evento" required>
            </div>
            <div>
              <label class="form-label" for="fecha_evento">Fecha del evento</label>
              <input class="form-control" type="date" id="fecha_evento" name="fecha_evento" required>
            </div>
            <div>
              <label class="form-label" for="lugar_evento">Lugar del evento</label>
              <input class="form-control" type="text" id="lugar_evento" name="lugar_evento" required>
            </div>
            <div>
              <label class="form-label" for="nombre_responsable">Nombre del responsable</label>
              <input class="form-control" type="text" id="nombre_responsable" name="nombre_responsable" required>
            </div>
            <div>
              <label class="form-label" for="telefono_responsable">Teléfono del responsable</label>
              <input class="form-control" type="tel" id="telefono_responsable" name="telefono_responsable" required>
            </div>
          </div>

          <div class="form-actions">
            <button class="btn-accent" type="submit" id="submitButton"><i class="bi bi-cloud-arrow-up me-2" aria-hidden="true"></i>Guardar evento</button>
            <div class="alert d-none" id="formMessage" role="status" aria-live="polite"></div>
          </div>
        </form>
      </section>
    </div>
  </main>

  <footer>
    <div class="container">
      <span>AgendaPro · Planificación de eventos</span>
      <span>Agendas precisas, equipos coordinados.</span>
    </div>
  </footer>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

    const supabase = createClient(
      'https://ylcekcftspapmjfshxpj.supabase.co',
      'sb_publishable_S6YdM3K1epNYt61qpVPTIQ_Zwvhj575'
    );

    const eventForm = document.querySelector('#eventForm');
    const submitButton = document.querySelector('#submitButton');
    const formMessage = document.querySelector('#formMessage');

    function showMessage(message, type) {
      formMessage.textContent = message;
      formMessage.className = `alert alert-${type}`;
    }

    eventForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      submitButton.disabled = true;
      submitButton.textContent = 'Guardando…';
      formMessage.classList.add('d-none');

      const formData = new FormData(eventForm);
      const newEvent = {
        nombre_evento: formData.get('nombre_evento'),
        fecha_evento: formData.get('fecha_evento'),
        lugar_evento: formData.get('lugar_evento'),
        nombre_responsable: formData.get('nombre_responsable'),
        telefono_responsable: formData.get('telefono_responsable')
      };

      try {
        const { error } = await supabase.from('eventos').insert(newEvent);
        if (error) throw error;

        eventForm.reset();
        showMessage('¡Gracias! Tu evento se guardó correctamente.', 'success');
      } catch (error) {
        showMessage(error.message, 'danger');
      } finally {
        submitButton.disabled = false;
        submitButton.innerHTML = '<i class="bi bi-cloud-arrow-up me-2" aria-hidden="true"></i>Guardar evento';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
